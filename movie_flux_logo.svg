<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7DCD6"/>
      <stop offset="1" stop-color="#4A8B85"/>
    </linearGradient>
    <linearGradient id="diagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62A39D"/>
      <stop offset="1" stop-color="#2E5E5A"/>
    </linearGradient>
    <linearGradient id="filmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ECDC7"/>
      <stop offset="1" stop-color="#3F7B75"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#3DDC84"/>

  <!-- M monogram -->
  <!-- Left vertical leg -->
  <path d="M108,76 L172,76 L172,340 L108,340 Z" fill="url(#legGrad)"/>

  <!-- Left diagonal (top-left of M down into the valley) -->
  <path d="M172,76 L220,76 L272,310 L228,310 Z" fill="url(#diagGrad)"/>

  <!-- Right diagonal (top-right of M down into the valley) -->
  <path d="M292,76 L340,76 L284,310 L240,310 Z" fill="url(#diagGrad)"/>

  <!-- Right vertical leg styled as film strip -->
  <path d="M340,76 L404,76 L404,340 L340,340 Z" fill="url(#filmGrad)"/>

  <!-- Sprocket holes -->
  <rect x="354" y="96"  width="18" height="22" rx="3" fill="#3DDC84"/>
  <rect x="354" y="138" width="18" height="22" rx="3" fill="#3DDC84"/>
  <rect x="354" y="180" width="18" height="22" rx="3" fill="#3DDC84"/>
  <rect x="354" y="222" width="18" height="22" rx="3" fill="#3DDC84"/>
  <rect x="354" y="264" width="18" height="22" rx="3" fill="#3DDC84"/>
  <rect x="354" y="306" width="18" height="22" rx="3" fill="#3DDC84"/>

  <!-- Wordmark -->
  <text x="256" y="438" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="800" font-size="76" letter-spacing="-1">
    <tspan fill="#0E2A2E">Movie</tspan><tspan fill="#5BA8A0">Flux</tspan>
  </text>
</svg>
